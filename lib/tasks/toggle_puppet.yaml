# default action is enable
# optionals:
#   action: enable or disable
#   reason: string, default "disabled by ansible"

- name: set default reason
  set_fact:
    reason: "disabled by ansible"

- name: "Enable puppet agent"
  ansible.builtin.command: /opt/puppetlabs/bin/puppet agent --enable
  when: action != "disable"

- name: "{{ action | default('enable')}} puppet agent"
  command: "/opt/puppetlabs/bin/puppet agent --{{ action | default('enable') }}{{ (' ' + disable_message | quote) if action == 'disable' and disable_message is defined else '' }}"
